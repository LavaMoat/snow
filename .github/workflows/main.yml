name: Tests
on:
  pull_request:
  workflow_dispatch:

# Only browsers marked `required: true` in the test-csp1 matrix below are required checks.
# Every other matrix entry in both jobs sets continue-on-error, which makes GitHub report its
# outcome as "success" for branch-protection purposes even if its steps actually fail — so a red
# Firefox/Safari or CSP=0 run never blocks merging, while a red required CSP=1 run genuinely fails
# the check. To make another browser mandatory, flip its `required` flag in the matrix below.

jobs:
  test-csp1:
    name: CSP ENABLED ${{ matrix.browser }}${{ matrix.required && ' (required)' || ' (informative)' }}
    runs-on: macos-15
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            required: true
          - browser: firefox
            required: false
          - browser: safari
            required: false
    env:
      CSP: '1'
    steps:
      - name: log env var used
        run: echo $CSP
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4
      - name: Install Firefox
        if: matrix.browser == 'firefox'
        uses: ./.github/actions/install-firefox
      - name: Use Node.js 24.x
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e #v4
        with:
          node-version: 24.x
      - name: Install Dependencies
        run: |
          yarn
          yarn setup
      - name: Test ${{ matrix.browser }}
        run: yarn build-test-${{ matrix.browser }}

  test-csp0:
    name: CSP DISABLED ${{ matrix.browser }} (informative)
    needs: test-csp1
    # on a manual run, still exercise CSP=0 
    if: always() && (github.event_name == 'workflow_dispatch')
    continue-on-error: true
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, safari]
    env:
      CSP: '0'
    steps:
      - name: log env var used
        run: echo $CSP
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4
      - name: Install Firefox
        if: matrix.browser == 'firefox'
        uses: ./.github/actions/install-firefox
      - name: Use Node.js 24.x
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e #v4
        with:
          node-version: 24.x
      - name: Install Dependencies
        run: |
          yarn
          yarn setup
      - name: Test ${{ matrix.browser }}
        run: yarn build-test-${{ matrix.browser }}
